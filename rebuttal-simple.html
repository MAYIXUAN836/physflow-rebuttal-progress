<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rebuttal · 简洁编辑</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#20252b;background:#fafafa;font:14px/1.5 system-ui,sans-serif}main{max-width:1600px;margin:auto;padding:24px}header{display:flex;align-items:center;gap:20px;margin-bottom:20px}h1{font-size:20px;margin:0}header a{color:#666;margin-left:auto}nav{display:flex;gap:8px;margin-bottom:16px}button{font:inherit;cursor:pointer;border:1px solid #d8dce0;background:white;border-radius:6px;padding:8px 15px}button[aria-selected=true]{background:#253d51;color:white;border-color:#253d51}.bar{display:flex;align-items:center;gap:16px;margin-bottom:12px}.bar strong{font-size:16px}.bar output{font-variant-numeric:tabular-nums;color:#46576a}.bar button{margin-left:auto}.columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border:1px solid #d8dce0;background:white;border-radius:6px;overflow:hidden}.column+ .column{border-left:1px solid #d8dce0}.label{padding:10px 16px;border-bottom:1px solid #e4e6e8;color:#68717b;font-size:12px}textarea,iframe{width:100%;height:auto;min-height:0;border:0;display:block}textarea{resize:none;overflow:hidden;padding:20px;outline-offset:-3px;font:13px/1.7 ui-monospace,SFMono-Regular,monospace;tab-size:2}footer{display:flex;justify-content:space-between;gap:16px;margin-top:10px;color:#747c85;font-size:12px}@media(max-width:760px){main{padding:14px}.columns{grid-template-columns:1fr}.column+.column{border-left:0;border-top:1px solid #ddd}.bar{flex-wrap:wrap}nav{flex-wrap:wrap}}
.reply-block{margin-bottom:36px}.reply-block .bar{flex-wrap:wrap}#title{font-size:16px;margin:0 0 16px}
</style>
<main>
<header><h1>Rebuttal</h1><a href="index.html">完整面板 ↗</a></header>
<nav aria-label="回复分组" role="tablist"></nav>

<div id="blocks"></div>
<template id="block-template"><section class="reply-block">
<div class="bar"><strong data-role="title"></strong><output data-role="count" aria-live="polite"></output><button data-role="restore" hidden>恢复本地备份</button><button data-role="download">导出 Markdown</button></div>
<div class="columns"><div class="column"><div class="label">Markdown · 可编辑</div><textarea data-role="editor" aria-label="Markdown 回复正文" spellcheck="false"></textarea></div><div class="column"><div class="label">实时预览</div><iframe data-role="preview" title="回复预览" sandbox="allow-same-origin" scrolling="no"></iframe></div></div>
<footer><span data-role="status" role="status"></span><span>字符数包含 Markdown 标记与换行 · 打开优先主稿 · 编辑仅保存为本地备份</span></footer>
</section></template>
</main>
